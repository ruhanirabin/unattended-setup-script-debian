name: Update Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT }}

    - name: Set up Git
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

    - name: Update Changelog
      env:
        GH_TOKEN: ${{ secrets.PAT }}
      run: |
        # Extract version from setup_auto_updates.sh (single source of truth)
        NEW_VERSION=$(grep -oP '(?<=^VERSION=")[^"]+' setup_auto_updates.sh)

        if [[ -z "$NEW_VERSION" ]]; then
          echo "ERROR: Could not extract VERSION from setup_auto_updates.sh"
          exit 1
        fi

        echo "Extracted version: $NEW_VERSION"

        # Check if this version already has a tag
        if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
          echo "Version $NEW_VERSION already tagged. Skipping changelog update."
          exit 0
        fi

        # Get the current date
        CURRENT_DATE=$(date "+%Y-%m-%d")

        # Get the latest commit message (skip changelog-update commits)
        COMMIT_MSG=$(git log -1 --pretty=%B)

        if [[ $COMMIT_MSG == "Update changelog for"* ]]; then
          echo "Skipping: commit is a changelog update."
          exit 0
        fi

        # Update CHANGELOG.md if entry doesn't exist
        if ! grep -q "## \[$NEW_VERSION\]" CHANGELOG.md; then
          sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [$NEW_VERSION] - $CURRENT_DATE\n\n### Added\n\n- $COMMIT_MSG/" CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "Update changelog for $NEW_VERSION"
          git push https://$GH_TOKEN@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}

          # Create new tag
          git tag "$NEW_VERSION"
          git push https://$GH_TOKEN@github.com/${{ github.repository }}.git "$NEW_VERSION"

          echo "CHANGELOG.md updated and tagged $NEW_VERSION"
        else
          echo "Changelog entry for version $NEW_VERSION already exists."
        fi
